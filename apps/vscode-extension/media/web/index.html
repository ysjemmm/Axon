<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axon</title>
    <!--
      启动占位页（boot splash）。
      主 bundle 有数 MB，webview 冷启动时下载 + 解析需要时间。此前 #root 是空的，
      这段时间面板就是纯白，看起来像卡死。这里把占位直接写进 HTML：它不依赖任何 JS/CSS 资源，
      HTML 一到就能绘制，直到 React 首次提交（会清空 #root 的子节点）才被替换掉。
      配色沿用 VS Code 主题变量，跟随明暗主题。
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #axon-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--vscode-editor-background, #ffffff);
        color: var(--vscode-foreground, #2b2b2b);
        font-family: var(--vscode-font-family, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
      }
      #axon-boot .mark {
        animation: axon-boot-pulse 1.8s ease-in-out infinite;
      }
      #axon-boot .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #axon-boot .hint {
        font-size: 12px;
        opacity: 0.6;
      }
      #axon-boot .bar {
        width: 148px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(128, 128, 128, 0.25);
      }
      #axon-boot .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #6366f1, #38bdf8, #a78bfa);
        animation: axon-boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes axon-boot-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      @keyframes axon-boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #axon-boot .mark,
        #axon-boot .bar::after {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CLFcdiqE.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BQJTNam4.css">
  </head>
  <body>
    <div id="root">
      <div id="axon-boot" role="status" aria-live="polite">
        <svg
          class="mark"
          width="56"
          height="56"
          viewBox="0 0 100 100"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <circle cx="50" cy="50" r="46" stroke="url(#axon-boot-ring)" stroke-width="4" fill="none" />
          <circle cx="50" cy="50" r="12" fill="url(#axon-boot-core)" />
          <line x1="50" y1="38" x2="50" y2="18" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.8" />
          <line x1="60" y1="56" x2="76" y2="72" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
          <line x1="40" y1="56" x2="24" y2="72" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.8" />
          <circle cx="50" cy="16" r="4" fill="#6366f1" />
          <circle cx="78" cy="74" r="3.5" fill="#38bdf8" />
          <circle cx="22" cy="74" r="3.5" fill="#a78bfa" />
          <defs>
            <linearGradient id="axon-boot-ring" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1" />
              <stop offset="50%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#a78bfa" />
            </linearGradient>
            <radialGradient id="axon-boot-core" cx="40%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#4f46e5" />
            </radialGradient>
          </defs>
        </svg>
        <div class="title">Axon</div>
        <div class="bar"></div>
        <div class="hint">正在启动…</div>
      </div>
    </div>
  </body>
</html>
